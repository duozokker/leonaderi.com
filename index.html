<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo Naderi | Interactive Portfolio World</title>
  <meta name="description" content="Explore Leo Naderi's interactive retro-style portfolio world. Discover projects, company work, and contact paths through a playable pixel town." />
  <meta name="author" content="Leo Naderi" />
  <meta name="theme-color" content="#2b6cb0" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Leo Naderi Portfolio" />
  <meta property="og:title" content="Leo Naderi | Interactive Portfolio World" />
  <meta property="og:description" content="A playful pixel-world portfolio: projects, business, and story-driven interactions in one experience." />
  <meta property="og:url" content="https://leonaderi.com/" />
  <meta property="og:image" content="https://leonaderi.com/assets/pictures/leo-headshot-og.jpg" />
  <meta property="og:image:alt" content="Portrait of Leo Naderi" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Leo Naderi | Interactive Portfolio World" />
  <meta name="twitter:description" content="Explore Leo Naderi's playable pixel portfolio and discover projects, company work, and contact links." />
  <meta name="twitter:image" content="https://leonaderi.com/assets/pictures/leo-headshot-og.jpg" />

  <link rel="icon" type="image/png" href="/assets/pictures/leo-headshot.png" />
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- Strong Debug Inspection Panel -->
  <div id="debug-panel" class="hidden retro-window">
    <h3>Engine Inspection</h3>
    <div class="debug-row">FPS: <span id="debug-fps" class="debug-val">0</span></div>
    <div class="debug-row">Objects: <span id="debug-objs" class="debug-val">0</span></div>
    <div class="debug-row">Cam Pos: <span id="debug-cam" class="debug-val">0,0</span></div>
    <div class="debug-row">Player Pos: <span id="debug-player" class="debug-val">0,0</span></div>
    <div class="debug-row">State: <span id="debug-state" class="debug-val">IDLE</span></div>
    <div class="debug-hint">[F3] Close Debugger</div>
  </div>

  <!-- Onboarding Screen -->
  <div id="onboarding-ui">
    <div class="onboarding-content">
      <h2>Willkommen in Leos Welt</h2>
      <p>Nutze WASD oder tippe auf den Bildschirm / Joystick, um dich zu bewegen.<br>Drücke SPACE am schwarzen Brett für Infos.</p>
      <button id="start-btn" class="retro-btn">Start Game</button>
    </div>
  </div>

  <!-- HUD Overlay -->
  <div id="hud-ui">
    <!-- Top Left: Profile -->
    <div class="hud-profile">
      <div class="hud-avatar"></div>
      <div class="hud-info">
        <h4>Leo Naderi</h4>
        <p>Developer & Creator</p>
      </div>
    </div>

    <!-- Top Right: Quick Links -->
    <div class="hud-links">
      <button id="banner-btn" class="hud-link" title="Toggle Banners" style="font-size: 0.6rem; cursor: pointer; border: 4px solid var(--border-dark); background: var(--bg-panel); color: var(--text-main); font-family: var(--font-pixel);">TAGS</button>
      <button id="lang-btn" class="hud-link" title="Toggle Language" style="font-size: 0.6rem; cursor: pointer; border: 4px solid var(--border-dark); background: var(--bg-panel); color: var(--text-main); font-family: var(--font-pixel);">EN</button>
    </div>
  </div>

  <!-- Dialog UI (Pokemon Style) -->
  <div id="dialog-ui" class="hidden retro-window">
    <div class="dialog-box">
      <div class="dialog-avatar"></div>
      <div class="dialog-content">
        <h3 id="dialog-title">Name</h3>
        <p id="dialog-body">Text goes here...</p>
        <div id="dialog-actions" class="hidden">
          <!-- Dynamic Action Buttons will spawn here -->
        </div>
      </div>
      <div class="dialog-arrow"></div>
    </div>
  </div>

  <!-- Mobile Virtual Controls -->
  <div id="mobile-controls">
    <div class="dpad">
      <button id="btn-up" class="dpad-btn up"></button>
      <button id="btn-left" class="dpad-btn left"></button>
      <button id="btn-right" class="dpad-btn right"></button>
      <button id="btn-down" class="dpad-btn down"></button>
      <div class="dpad-center"></div>
    </div>
    <div class="action-buttons">
      <button id="btn-a" class="action-btn">A</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
